<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Face-Key</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,460;9..144,560&family=Outfit:wght@380;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <style>
    [data-theme="nocturne"] {
      --canvas: #070707;
      --bg: #0e0e0e;
      --surface: #171717;
      --surface-2: #212121;
      --text: #f6f1e7;
      --text-dim: #b6a88a;
      --accent: #e0c78a;
      --accent-ink: #14120c;
      --line: rgba(224, 199, 138, 0.32);
      --danger: #c45c4a;
      --ok: #8fb58a;
      --shadow: 0 0 0 1px rgba(224, 199, 138, 0.18);
      --radius: 20px;
      --font-display: "Fraunces", "Iowan Old Style", Palatino, serif;
      --font-ui: "Outfit", "Avenir Next", system-ui, sans-serif;
      --display-weight: 560;
      --frame-border: 1px solid var(--line);
      --frame-shadow: 0 0 0 1px rgba(224, 199, 138, 0.12), 0 0 48px rgba(224, 199, 138, 0.06);
      --camera-shadow: none;
      --nav-height: 64px;
    }
    [data-theme="linen"] {
      --canvas: #e6e0d4;
      --bg: #f4f0e7;
      --surface: #fbf8f3;
      --surface-2: #efeae1;
      --text: #1c241f;
      --text-dim: #6e675c;
      --accent: #6d7349;
      --accent-ink: #f7f4ee;
      --line: rgba(28, 36, 31, 0.12);
      --danger: #9c3b2e;
      --ok: #3e6b45;
      --shadow: 0 10px 28px rgba(60, 48, 30, 0.08);
      --radius: 22px;
      --font-display: "Outfit", "Avenir Next", system-ui, sans-serif;
      --font-ui: "Outfit", "Avenir Next", system-ui, sans-serif;
      --display-weight: 650;
      --frame-border: 1px solid var(--line);
      --frame-shadow: var(--shadow);
      --camera-shadow: var(--shadow);
      --nav-height: 64px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--canvas);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: var(--font-ui);
      font-size: 15px;
      font-weight: 380;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .phone-frame {
      width: 100%;
      max-width: 420px;
      max-height: 747px;
      height: 100vh;
      height: 100dvh;
      aspect-ratio: 9/16;
      background: var(--bg);
      border: var(--frame-border);
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      box-shadow: var(--frame-shadow);
    }
    @media (max-width: 440px) {
      .phone-frame {
        border-radius: 0;
        border: none;
        box-shadow: none;
        max-width: 100%;
        max-height: 100%;
        aspect-ratio: auto;
        height: 100vh;
        height: 100dvh;
      }
    }
    .toast-container {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 999;
      pointer-events: none;
    }
    .toast {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--line);
      padding: 12px 16px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 13px;
      text-align: center;
      animation: toastIn 0.4s ease, toastOut 0.35s ease 2.5s forwards;
      box-shadow: var(--shadow);
      margin-bottom: 8px;
      pointer-events: auto;
    }
    .toast.success { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
    .toast.error { background: var(--danger); color: #fff; border-color: transparent; }
    @keyframes toastIn { from { transform: translateY(-60px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes toastOut { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-60px); opacity: 0; } }
    .app-header {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 16px 18px 12px;
      min-height: 52px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--line);
    }
    .wordmark {
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.02em;
    }
    .theme-switch {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      gap: 2px;
      padding: 2px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--line);
    }
    .theme-switch button {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-family: var(--font-ui);
      font-size: 11px;
      font-weight: 600;
      min-height: 28px;
      min-width: 44px;
      padding: 0 10px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .theme-switch button svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 1.75; }
    .theme-switch button[aria-pressed="true"] {
      background: var(--accent);
      color: var(--accent-ink);
    }
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px 18px;
      -webkit-overflow-scrolling: touch;
    }
    .bottom-nav {
      display: flex;
      border-top: 1px solid var(--line);
      flex-shrink: 0;
      height: var(--nav-height);
      background: var(--surface);
    }
    .bottom-nav .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      color: var(--text-dim);
      transition: color 0.2s, opacity 0.2s;
      font-size: 11px;
      font-weight: 500;
      position: relative;
      min-height: 44px;
    }
    .bottom-nav .nav-item .nav-icon {
      display: flex;
      width: 22px;
      height: 22px;
    }
    .bottom-nav .nav-item .nav-icon svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .bottom-nav .nav-item.active { color: var(--accent); font-weight: 600; }
    .bottom-nav .nav-item.active::after {
      content: '';
      position: absolute;
      top: 0;
      left: 22%;
      right: 22%;
      height: 2px;
      background: var(--accent);
    }
    .bottom-nav .nav-item.locked {
      opacity: 0.4;
      cursor: not-allowed;
      pointer-events: none;
    }
    .display-title {
      font-family: var(--font-display);
      font-weight: var(--display-weight);
      font-size: 36px;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 16px;
    }
    .section-title {
      font-family: var(--font-display);
      font-weight: var(--display-weight);
      font-size: 18px;
      color: var(--text);
      margin-bottom: 12px;
    }
    .meta, .hint {
      font-size: 12px;
      color: var(--text-dim);
      line-height: 1.45;
    }
    .hint { text-align: center; margin-top: 12px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px 18px;
      margin-bottom: 16px;
    }
    .privacy-notice {
      background: var(--surface);
      border: 1px solid var(--line);
      border-left: 3px solid var(--accent);
      border-radius: var(--radius);
      padding: 16px 18px;
      margin-bottom: 16px;
      font-size: 15px;
      color: var(--text);
      line-height: 1.45;
    }
    .checkbox-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      min-height: 52px;
      padding: 12px 0;
      cursor: pointer;
      color: var(--text);
      font-size: 15px;
      font-weight: 500;
      text-transform: none;
      letter-spacing: 0;
    }
    .checkbox-row + .checkbox-row { border-top: 1px solid var(--line); }
    .checkbox-row input {
      appearance: none;
      width: 22px;
      height: 22px;
      min-height: 22px;
      margin: 0;
      flex-shrink: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface-2);
      cursor: pointer;
    }
    .checkbox-row input:checked {
      background: var(--accent);
      border-color: var(--accent);
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2314120c' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M5 12.5 10 17.5 19 7'/></svg>");
      background-size: 14px;
      background-repeat: no-repeat;
      background-position: center;
    }
    [data-theme="linen"] .checkbox-row input:checked {
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f7f4ee' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M5 12.5 10 17.5 19 7'/></svg>");
    }
    label {
      display: block;
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
    }
    input, select {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 16px;
      margin-bottom: 16px;
      appearance: none;
      outline: none;
    }
    select {
      background-image:
        linear-gradient(45deg, transparent 50%, var(--text-dim) 50%),
        linear-gradient(135deg, var(--text-dim) 50%, transparent 50%);
      background-position: calc(100% - 18px) calc(50% - 3px), calc(100% - 12px) calc(50% - 3px);
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
      padding-right: 36px;
    }
    input:focus, select:focus, button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    button, .btn {
      font-family: var(--font-ui);
      padding: 14px 22px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      border: none;
      width: 100%;
      text-align: center;
      min-height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary {
      background: var(--accent);
      color: var(--accent-ink);
    }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--text);
    }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-text, .btn-sm {
      background: transparent;
      color: var(--text);
      min-height: 44px;
      width: auto;
      padding: 8px 12px;
      font-weight: 500;
      font-size: 15px;
      border: none;
      box-shadow: none;
    }
    .btn:disabled { opacity: 0.4; pointer-events: none; filter: none; }
    .btn-row, .choice-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 360px) {
      .choice-row { grid-template-columns: 1fr; }
    }
    .counter-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .stepper-btn {
      width: 44px;
      min-width: 44px;
      height: 44px;
      min-height: 44px;
      padding: 0;
      border-radius: 14px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      color: var(--text);
      font-size: 20px;
      font-weight: 500;
    }
    .counter-row .count {
      min-width: 32px;
      text-align: center;
      font-size: 18px;
      font-weight: 600;
    }
    .camera-container {
      position: relative;
      background: var(--canvas);
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--line);
      margin-bottom: 8px;
      aspect-ratio: 4/3;
      max-height: 260px;
      box-shadow: var(--camera-shadow);
    }
    .camera-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    .pose-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      transform: scaleX(-1);
    }
    .db-banner {
      display: none;
      flex-shrink: 0;
      padding: 10px 18px;
      font-size: 12px;
      line-height: 1.4;
      color: var(--text);
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }
    .db-banner.visible { display: block; }
    .yaw-meter {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 8px 0 4px;
      min-height: 32px;
    }
    .yaw-meter .yaw-end {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      width: 14px;
    }
    .yaw-track {
      position: relative;
      flex: 1;
      height: 10px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--line);
    }
    .yaw-zone {
      position: absolute;
      top: -2px;
      height: 12px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--accent) 55%, transparent);
    }
    .yaw-knob {
      position: absolute;
      top: 50%;
      width: 14px;
      height: 14px;
      margin-left: -7px;
      border-radius: 50%;
      background: var(--accent);
      transform: translateY(-50%);
    }
    .badge-skipped {
      background: var(--surface-2);
      color: var(--text-dim);
      box-shadow: inset 0 0 0 1px var(--line);
    }
    [data-theme="nocturne"] .camera-container::before,
    [data-theme="nocturne"] .camera-container::after {
      content: '';
      position: absolute;
      width: 22px;
      height: 22px;
      pointer-events: none;
      z-index: 2;
      border-color: var(--accent);
      border-style: solid;
    }
    [data-theme="nocturne"] .camera-container::before {
      top: 10px; left: 10px;
      border-width: 1.5px 0 0 1.5px;
    }
    [data-theme="nocturne"] .camera-container::after {
      bottom: 10px; right: 10px;
      border-width: 0 1.5px 1.5px 0;
    }
    [data-theme="nocturne"] .camera-container .viewfinder-brackets {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }
    [data-theme="nocturne"] .camera-container .viewfinder-brackets::before,
    [data-theme="nocturne"] .camera-container .viewfinder-brackets::after {
      content: '';
      position: absolute;
      width: 22px;
      height: 22px;
      border-color: var(--accent);
      border-style: solid;
    }
    [data-theme="nocturne"] .camera-container .viewfinder-brackets::before {
      top: 10px; right: 10px;
      border-width: 1.5px 1.5px 0 0;
    }
    [data-theme="nocturne"] .camera-container .viewfinder-brackets::after {
      bottom: 10px; left: 10px;
      border-width: 0 0 1.5px 1.5px;
    }
    .angle-badge {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent);
      color: var(--accent-ink);
      padding: 6px 14px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 12px;
      z-index: 2;
    }
    .capture-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
      font-size: 13px;
      color: var(--text-dim);
    }
    .capture-top strong { color: var(--text); font-weight: 600; }
    .angle-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .badge-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 28px;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
    }
    .badge-done { background: var(--accent); color: var(--accent-ink); }
    .badge-pending { background: var(--surface-2); color: var(--text-dim); }
    .badge-current {
      background: transparent;
      color: var(--accent);
      box-shadow: inset 0 0 0 1.5px var(--accent);
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
    .capture-actions { text-align: center; margin: 8px 0 16px; }
    .tile-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .tile {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px 18px;
      text-align: left;
      cursor: pointer;
      min-height: 96px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .service-request { width: 100%; color: var(--text); font: inherit; }
    .service-request .tile-icon { color: var(--accent); }
    .tile.on {
      background: color-mix(in srgb, var(--accent) 18%, var(--surface));
      border-color: var(--accent);
    }
    .tile.dnd-active {
      background: color-mix(in srgb, var(--danger) 16%, var(--surface));
      border-color: var(--danger);
    }
    .tile-icon {
      width: 22px;
      height: 22px;
      color: var(--text);
    }
    .tile-icon svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .tile-label { font-size: 15px; font-weight: 600; color: var(--text); }
    .tile-state { font-size: 12px; color: var(--text-dim); }
    .tile.on .tile-state { color: var(--accent); }
    .tile.dnd-active .tile-state { color: var(--danger); }
    .highlight-box, .room-hero {
      text-align: center;
      padding: 8px 0 24px;
    }
    .room-kicker {
      display: flex;
      align-items: center;
      gap: 12px;
      justify-content: center;
      margin: 8px 0 12px;
      color: var(--text-dim);
      font-size: 13px;
    }
    .room-kicker::before, .room-kicker::after {
      content: '';
      height: 1px;
      width: 40px;
      background: var(--line);
    }
    .big-number, .room-number {
      font-family: var(--font-display);
      font-weight: var(--display-weight);
      font-size: 64px;
      line-height: 1;
      letter-spacing: -0.03em;
      color: var(--text);
    }
    .room-type { color: var(--text-dim); font-size: 15px; margin-top: 8px; }
    .passkey-line {
      margin-top: 16px;
      font-size: 12px;
      color: var(--text-dim);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .passkey-line span { margin-right: 8px; font-family: var(--font-ui); }
    .divider {
      border: none;
      border-top: 1px solid var(--line);
      margin: 24px 0 16px;
    }
    .checkout-block { margin-top: 32px; }
    canvas#hiddenCanvas { display: none; }
    .camera-status {
      text-align: center;
      font-size: 13px;
      color: var(--text-dim);
      margin: 4px 0 8px;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      line-height: 1.35;
    }
    .camera-status.error {
      color: #fff;
      background: var(--danger);
      border-radius: 12px;
    }
    .lock-overlay {
      min-height: 70%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text-dim);
      text-align: center;
      padding: 32px 18px;
    }
    .lock-overlay svg {
      width: 28px;
      height: 28px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
    }
    .icon-inline {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body data-theme="nocturne">
<div class="phone-frame" id="phoneFrame">
  <div class="toast-container" id="toastContainer"></div>
  <div class="app-header">
    <div class="wordmark">Face-Key</div>
    <div class="theme-switch" id="themeSwitch" role="group" aria-label="Theme">
      <button type="button" id="themeNight" data-theme-set="nocturne" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 14.5A8.5 8.5 0 0 1 9.5 3 7 7 0 1 0 21 14.5z"/></svg>
        Night
      </button>
      <button type="button" id="themeDay" data-theme-set="linen" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M5 12H3M21 12h-2M6.2 6.2 4.8 4.8M19.2 19.2l-1.4-1.4M6.2 17.8 4.8 19.2M19.2 4.8l-1.4 1.4"/></svg>

  // ── Camera helpers ───────────────────────────
  async function getCameraStream() {
    if (APP.cameraStream && APP.cameraStream.getTracks().some(t => t.readyState === 'live')) {
      return APP.cameraStream;
    }
    stopCameraTracks();
    const stream = await navigator.mediaDevices.getUserMedia({ video:{facingMode:'user',width:{ideal:640},height:{ideal:480}}, audio:false });
    APP.cameraStream = stream;
    return stream;
  }
  function stopPoseLoop() {
    APP.isDetecting = false;
    APP.poseLooping = false;
    if (APP.poseRaf) { cancelAnimationFrame(APP.poseRaf); APP.poseRaf = null; }
    if (APP.detectionInterval) { clearInterval(APP.detectionInterval); APP.detectionInterval = null; }
  }
  function stopCameraTracks() {
    if (APP.cameraStream) { APP.cameraStream.getTracks().forEach(t=>t.stop()); APP.cameraStream=null; }
  }
  function stopCamera() {
    stopPoseLoop();
    stopCameraTracks();
  }
  async function ensureLandmarker() {
    if (APP.faceLandmarker) return APP.faceLandmarker;
    if (APP.landmarkerFailed) throw new Error('Pose check failed to load');
    const { FaceLandmarker, FilesetResolver } = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.17/+esm');
    const wasm = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.17/wasm';
    const vision = await FilesetResolver.forVisionTasks(wasm);
    const model = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
    const opts = { runningMode: 'VIDEO', numFaces: 1, outputFaceBlendshapes: true };
    try {
      APP.faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
        ...opts,
        baseOptions: { modelAssetPath: model, delegate: 'GPU' }
      });
    } catch (e) {
      APP.faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
        ...opts,
        baseOptions: { modelAssetPath: model, delegate: 'CPU' }
      });
    }
    return APP.faceLandmarker;
  }
  function mirrored(p) { return { x: 1 - p.x, y: p.y }; }
  function poseFromLandmarks(landmarks) {
    const le = mirrored(landmarks[33]);
    const re = mirrored(landmarks[263]);
    const nose = mirrored(landmarks[1]);
    const eyeDist = Math.hypot(le.x - re.x, le.y - re.y);
    const eyeMidX = (le.x + re.x) / 2;
    const eyeMidY = (le.y + re.y) / 2;
    const yaw = YAW_SIGN * (nose.x - eyeMidX) / (eyeDist || 1);
    const pitch = (nose.y - eyeMidY) / (eyeDist || 1);
    return { yaw, pitch, eyeDist, le, re, nose };
  }
  function extractTemplate(landmarks) {
    const ids = [1, 33, 263, 61, 291, 13, 14, 152, 234, 454];
    const le = mirrored(landmarks[33]);
    const re = mirrored(landmarks[263]);
    const midX = (le.x + re.x) / 2, midY = (le.y + re.y) / 2;
    const eyeDist = Math.hypot(le.x - re.x, le.y - re.y) || 1;
    return ids.map(i => {
      const p = mirrored(landmarks[i]);
      return { x: (p.x - midX) / eyeDist, y: (p.y - midY) / eyeDist };
    });
  }
  function yawToPct(yaw) {
    return Math.max(0, Math.min(100, (yaw + YAW_SPAN) / (YAW_SPAN * 2) * 100));
  }
  function angleAccepted(angle, yaw, pitch) {
    const ay = Math.abs(yaw);
    if (angle === 'front') return ay < 0.08 && pitch >= 0.55 && pitch <= 1.2;
    if (angle === 'left') return yaw < -0.12;
    if (angle === 'right') return yaw > 0.12;
    if (angle === 'up') return pitch < APP.neutralPitch - 0.16 && ay < 0.16;
    if (angle === 'down') return pitch > APP.neutralPitch + 0.16 && ay < 0.16;
    return false;
  }
  function poseStatusLine(angle, yaw, pitch, hits) {
    const nums = `yaw ${yaw.toFixed(2)} · pitch ${pitch.toFixed(2)}`;
    if (hits > 0 && angleAccepted(angle, yaw, pitch)) return `Hold still · ${nums}`;
    if (angle === 'front') return `Look straight at the camera · ${nums}`;
    if (angle === 'left') return `Turn your head left · ${nums}`;
    if (angle === 'right') return `Turn your head right · ${nums}`;
    if (angle === 'up') return `Tilt your chin up · ${nums}`;
    if (angle === 'down') return `Tilt your chin down · ${nums}`;
    return nums;
  }
  function updateYawMeter(angle, yaw) {
    const zone = document.getElementById('yawZone');
    const knob = document.getElementById('yawKnob');
    if (!zone || !knob) return;
    let z0 = 0, z1 = 0;
    if (angle === 'left') { z0 = yawToPct(-YAW_SPAN); z1 = yawToPct(-0.12); }
    else if (angle === 'right') { z0 = yawToPct(0.12); z1 = yawToPct(YAW_SPAN); }
    else { z0 = yawToPct(-0.08); z1 = yawToPct(0.08); }
    if (angle === 'up' || angle === 'down') { z0 = yawToPct(-0.16); z1 = yawToPct(0.16); }
    zone.style.left = Math.min(z0, z1) + '%';
    zone.style.width = Math.abs(z1 - z0) + '%';
    knob.style.left = yawToPct(yaw) + '%';
  }
  function drawPoseOverlay(canvas, landmarks) {
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    if (!landmarks) return;
    const le = landmarks[33], re = landmarks[263], nose = landmarks[1];
    ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue('--accent').trim() || '#e0c78a';
    ctx.fillStyle = ctx.strokeStyle;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(le.x * w, le.y * h);
    ctx.lineTo(re.x * w, re.y * h);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(nose.x * w, nose.y * h, 5, 0, Math.PI * 2);
    ctx.fill();
  }
  function guestKey(angle) { return APP.currentGuestIndex + ':' + angle; }
  function isVerified(angle, guestIndex) {
    const gi = guestIndex == null ? APP.currentGuestIndex : guestIndex;
    return APP.capturedTokens.some(t => t.guestIndex === gi && t.angle === angle && t.template && !t.skipped);
  }
  function isSkipped(angle, guestIndex) {
    const gi = guestIndex == null ? APP.currentGuestIndex : guestIndex;
    return !!(APP.skippedAngles[gi + ':' + angle]);
  }
  function guestAnglesComplete(gi) {
    if (!isVerified('front', gi)) return false;
    return APP.angleOrder.every(a => a === 'front' ? isVerified(a, gi) : (isVerified(a, gi) || isSkipped(a, gi)));
  }

  // face-api.js supplies identity descriptors; MediaPipe remains responsible for liveness and pose.
  async function ensureFaceModels() {
    if (!faceModelsPromise) faceModelsPromise = Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(FACE_MODEL_URL),
      faceapi.nets.faceLandmark68Net.loadFromUri(FACE_MODEL_URL),
      faceapi.nets.faceRecognitionNet.loadFromUri(FACE_MODEL_URL)
    ]).catch(error => { faceModelsPromise = null; throw error; });
    return faceModelsPromise;
  }
  async function extractFaceEmbedding(video) {
    await ensureFaceModels();
    const result = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.5 }))
      .withFaceLandmarks().withFaceDescriptor();
    const embedding = result?.descriptor;
    if (!embedding || embedding.length !== 128 || Array.from(embedding).some(value => !Number.isFinite(value))) {
      throw new Error('Could not create a face embedding. Center your face and try again.');
    }
    return Array.from(embedding);
  }
  function parseEmbedding(value) {
    try {
      const data = typeof value === 'string' ? JSON.parse(value) : value;
      return Array.isArray(data) && data.length === 128 && data.every(Number.isFinite) ? data : null;
    } catch (e) { return null; }
  }
  function embeddingDistance(a, b) {
    if (!a || !b || a.length !== 128 || b.length !== 128) return Infinity;
    let sum = 0;
    for (let i = 0; i < 128; i++) sum += (a[i] - b[i]) ** 2;
    return Math.sqrt(sum);
  }
  async function matchStoredEmbedding(liveEmbedding, expectedGuestId) {
    if (APP.supabaseDown) return false;
    const eligibleIds = [];
    for (let offset = 0; ; offset += 1000) {
      const { data: guests, error: guestsError } = await supabase.from('guests').select('id').eq('is_checked_in', false).range(offset, offset + 999);
      if (guestsError) throw guestsError;
      eligibleIds.push(...(guests || []).map(row => row.id));
      if (!guests || guests.length < 1000) break;
    }
    if (!eligibleIds.length) return false;
    let bestGuestId = null, bestDistance = Infinity;
    for (let batch = 0; batch < eligibleIds.length; batch += 500) {
      const batchIds = eligibleIds.slice(batch, batch + 500);
      for (let offset = 0; ; offset += 1000) {
        const { data: tokens, error: tokensError } = await supabase.from('face_tokens').select('guest_id,face_token').in('guest_id', batchIds).range(offset, offset + 999);
        if (tokensError) throw tokensError;
        for (const row of tokens || []) {
          const stored = parseEmbedding(row.face_token);
          const distance = embeddingDistance(liveEmbedding, stored);
          if (distance < bestDistance) { bestDistance = distance; bestGuestId = row.guest_id; }
        }
        if (!tokens || tokens.length < 1000) break;
      }
    }
    return bestDistance <= MATCH_THRESHOLD && (!expectedGuestId || bestGuestId === expectedGuestId) ? bestGuestId : false;
  }

  // ── CAPTURE SCREEN ──
  function capturePillsHTML() {
    return APP.angleOrder.map(a => {
      let cls = 'badge-pending';
      if (isVerified(a)) cls = 'badge-done';
      else if (isSkipped(a)) cls = 'badge-skipped';
      else if (a === APP.currentAngleName) cls = 'badge-current';
      return `<span class="badge-pill ${cls}" data-angle="${a}">${isSkipped(a) && !isVerified(a) ? prettyAngle(a) + ' skip' : prettyAngle(a)}</span>`;
    }).join('');
  }
  function updateCaptureUI() {
    const total = APP.regGuestCount;
    const label = total > 1 ? `Guest ${APP.currentGuestIndex + 1} of ${total}` : 'Guest';
    const topStrong = document.querySelector('.capture-top strong');
    if (topStrong) topStrong.textContent = label;
    const angleLabel = document.getElementById('angleLabel');
    if (angleLabel) angleLabel.textContent = prettyAngle(APP.currentAngleName);
    const badge = document.getElementById('angleBadge');
    if (badge) badge.textContent = prettyAngle(APP.currentAngleName);
    const row = document.querySelector('.angle-row');
    if (row) row.innerHTML = capturePillsHTML();
    const complete = guestAnglesComplete(APP.currentGuestIndex);
    const btnAll = document.getElementById('btnAllDone');
    const btnNext = document.getElementById('btnNextGuest');
    if (btnAll) {
      const show = complete && APP.currentGuestIndex >= total - 1;
      btnAll.hidden = !show;
      btnAll.disabled = !show || APP.saveInFlight;
    }
    if (btnNext) {
      const show = complete && APP.currentGuestIndex < total - 1;
      btnNext.hidden = !show;
      btnNext.disabled = !show;
    }
  }
  function renderCapture() {
    mainContent.innerHTML = `
      <div class="capture-top"><strong></strong><span>Angle: <span id="angleLabel"></span></span></div>
      <div class="angle-row"></div>
      <div class="camera-container">

        <canvas class="pose-overlay" id="poseOverlay"></canvas>
        <div class="viewfinder-brackets"></div>
        <div class="angle-badge" id="angleBadge"></div>
      </div>
      <div class="yaw-meter" id="yawMeter">
        <span class="yaw-end">L</span>

  async function startCaptureCamera() {
    if (APP.screen !== 'capture') return;
    if (APP.poseLooping) return;
    const vid = document.getElementById('camVideo');
    const status = document.getElementById('camStatus');
    if (!vid) return;
    APP.stableCount = 0;
    APP.poseHits = 0;
    try {
      if (status) { status.textContent = 'Loading pose check…'; status.classList.remove('error'); }
      const stream = await getCameraStream();
      if (APP.screen !== 'capture' || !vid.isConnected) { stopCameraTracks(); return; }
      if (vid.srcObject !== stream) vid.srcObject = stream;
      await vid.play();
      await ensureLandmarker();
      if (status) status.textContent = 'Loading on-device identity model…';
      await ensureFaceModels();
      if (APP.screen !== 'capture' || !vid.isConnected) { stopCamera(); return; }
      if (status) { status.textContent = 'Pose check ready'; status.classList.remove('error'); }
      APP.isDetecting = true;
      APP.poseLooping = true;
      APP.lastPoseTs = 0;
      APP.poseRaf = requestAnimationFrame(() => capturePoseTick(vid));
    } catch (e) {
      APP.landmarkerFailed = /pose|landmarker|wasm|import/i.test(String(e && e.message)) || !APP.faceLandmarker;
      if (status) {
        if (String(e && e.message || '').toLowerCase().includes('camera') || e && e.name === 'NotAllowedError') {
          status.textContent = 'Camera error: ' + (e.message || e.name);
        } else if (APP.faceLandmarker) {
          status.textContent = 'Identity model failed to load. Check the connection and retry capture.';
        } else {
          status.textContent = 'Pose check failed to load. Angles cannot be verified.';
        }
        status.classList.add('error');
      }
      APP.poseLooping = false;
    }
  }

  function capturePoseTick(video) {
    if (!APP.isDetecting || APP.screen !== 'capture') { APP.poseLooping = false; return; }
    APP.poseRaf = requestAnimationFrame(() => capturePoseTick(video));
    if (APP.isCapturingAngle) return;
    const now = performance.now();
    if (now - APP.lastPoseTs < 100) return;
    APP.lastPoseTs = now;
    const status = document.getElementById('camStatus');
    const canvas = document.getElementById('poseOverlay');
    if (!APP.faceLandmarker) return;
    if (video.videoWidth) {
      if (canvas && (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight)) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
      }
    }
    let result;
    try {
      result = APP.faceLandmarker.detectForVideo(video, now);
    } catch (e) {
      if (status) { status.textContent = 'Pose check failed.'; status.classList.add('error'); }
      return;
    }
    const face = result && result.faceLandmarks && result.faceLandmarks[0];
    if (!face) {
      APP.poseHits = 0;
      if (canvas) drawPoseOverlay(canvas, null);
      if (status) { status.textContent = 'No face detected'; status.classList.remove('error'); }
      updateYawMeter(APP.currentAngleName, 0);
      return;
    }
    if (canvas) drawPoseOverlay(canvas, face);
    const pose = poseFromLandmarks(face);
    updateYawMeter(APP.currentAngleName, pose.yaw);
    if (pose.eyeDist < 0.06) {
      APP.poseHits = 0;
      if (status) { status.textContent = `Move closer · yaw ${pose.yaw.toFixed(2)} · pitch ${pose.pitch.toFixed(2)}`; status.classList.remove('error'); }
      return;
    }
    const angle = APP.currentAngleName;
    if (!angle || angle === 'done') {
      if (status) status.textContent = `Ready · yaw ${pose.yaw.toFixed(2)} · pitch ${pose.pitch.toFixed(2)}`;
      return;
    }
    if (Date.now() < APP.poseCooldownUntil) {
      if (status) status.textContent = poseStatusLine(angle, pose.yaw, pose.pitch, 0);
      return;
    }
    const ok = angleAccepted(angle, pose.yaw, pose.pitch);
    if (ok) {
      APP.poseHits++;
      if (status) {
        status.textContent = poseStatusLine(angle, pose.yaw, pose.pitch, APP.poseHits);
        status.classList.remove('error');
      }
      if (APP.poseHits >= APP.requiredStable) {
        finishAngle(face, pose, video);
      }
    } else {
      APP.poseHits = 0;
      if (status) {
        status.textContent = poseStatusLine(angle, pose.yaw, pose.pitch, 0);
        status.classList.remove('error');
      }
    }
  }

  async function finishAngle(landmarks, pose, video) {
    const angle = APP.currentAngleName;
    if (!angle || angle === 'done' || APP.isCapturingAngle) return;
    if (isVerified(angle)) return;
    APP.isCapturingAngle = true;
    if (angle === 'front') APP.neutralPitch = pose.pitch;
    const status = document.getElementById('camStatus');
    if (status) status.textContent = 'Creating on-device identity embedding…';
    try {
      const embedding = await extractFaceEmbedding(video);
      const template = extractTemplate(landmarks);
      APP.capturedTokens.push({ guestIndex: APP.currentGuestIndex, angle, template, embedding, skipped: false });
      showToast('Captured: ' + prettyAngle(angle), 'success');
      APP.poseHits = 0;
      APP.stableCount = 0;
      APP.poseCooldownUntil = Date.now() + 800;
      advanceAngle();
      updateCaptureUI();
    } catch (e) {
      if (status) { status.textContent = e.message || 'Could not create face embedding. Try again.'; status.classList.add('error'); }
      APP.poseHits = 0;
    } finally {
      APP.isCapturingAngle = false;
    }
  }

  function advanceAngle() {
    const remaining = APP.angleOrder.filter(a => !isVerified(a) && !isSkipped(a));
    APP.currentAngleName = remaining.length > 0 ? remaining[0] : 'done';
    APP.poseHits = 0;
    APP.stableCount = 0;
  }

  mainContent.addEventListener('click', async (e) => {
    if (APP.screen !== 'capture') return;
    if (e.target.closest('#btnSkip')) {
      if (APP.currentAngleName === 'front') {
        const status = document.getElementById('camStatus');
        if (status) status.textContent = 'Front cannot be skipped';
        return;
      }
      if (APP.currentAngleName && APP.currentAngleName !== 'done') {
        APP.skippedAngles[guestKey(APP.currentAngleName)] = true;
        APP.poseHits = 0;
        advanceAngle();
        updateCaptureUI();
      }
    }
    if (e.target.closest('#btnAllDone')) {
      if (APP.saveInFlight) return;
      const btn = document.getElementById('btnAllDone');
      if (btn) btn.disabled = true;
      stopCamera();
      await allocateRoomAndStore();
      if (APP.saveInFlight === false && document.getElementById('btnAllDone')) {
        updateCaptureUI();
      }
    }
    if (e.target.closest('#btnNextGuest')) {
      if (APP.currentGuestIndex < APP.regGuestCount - 1) {
        APP.currentGuestIndex++;
        APP.currentAngleName = 'front';
        APP.poseHits = 0;
        APP.stableCount = 0;
        APP.neutralPitch = 0.85;
        updateCaptureUI();
      }
    }
  });

  function persistStayLocal(room) {
    APP.allocatedRoom = room;
    if (!APP.guestDbId) APP.guestDbId = 'local-' + Date.now();
    const record = buildStayRecord(room);
    const previous = getLocalStay();
    if (!APP.capturedTokens.length && previous?.guestDbId === APP.guestDbId) record.templates = previous.templates || [];
    saveLocalStay(record);
    saveLocalPreferenceSnapshot();
  }

  // ── Room allocation & store ──────────────────
  async function allocateRoomAndStore() {
    if (APP.saveInFlight) return;
    APP.saveInFlight = true;
    if (APP.returningGuest) APP.guestDbId = APP.returningGuest.id;
    const btn = document.getElementById('btnAllDone');
    if (btn) btn.disabled = true;
    showToast('Allocating room…', '');
    try {
      if (APP.supabaseDown) {
        const randNum = String(Math.floor(100 + Math.random() * 900));
        persistStayLocal({ room_number: randNum, room_type: APP.regRoomType, passkeyHash: APP.passkeyHash });
        showToast('Saved on this device. Database is offline.', 'success');
        navigateTo('checkinOptions');
        return;
      }
      await Promise.allSettled(APP.faceTokenTasks);
      let { data:rooms, error } = await supabase.from('rooms').select('*').eq('room_type', APP.regRoomType).eq('is_occupied', false).limit(1);
      if (error) throw error;
      if (!rooms || rooms.length===0) {
        let { data:any, error:e2 } = await supabase.from('rooms').select('*').eq('is_occupied', false).limit(1);
        if (e2) throw e2;
        rooms = any;
      }
      let room;
      if (rooms && rooms.length>0) {
        room = rooms[0];
      } else {
        const randNum = String(Math.floor(100+Math.random()*900));
        const { data:ins, error:insErr } = await supabase.from('rooms').insert([{
          room_number: randNum, room_type: APP.regRoomType, max_occupancy: APP.regGuestCount,
          is_occupied: true, passkey: APP.passkeyHash
        }]).select().single();
        if (insErr) throw insErr;
        room = ins;
      }
      const { error:updErr } = await supabase.from('rooms').update({ is_occupied:true, passkey:APP.passkeyHash }).eq('id', room.id);
      if (updErr) throw updErr;
      APP.allocatedRoom = room;
      const guestValues = {
        name:APP.regName, phone:APP.regPhone, id_type:APP.regIdType, id_number:APP.regIdNumber,
        guest_count:APP.regGuestCount, room_number:room.room_number, passkey:APP.passkeyHash,
        identity_hash:APP.identityHash, is_checked_in:false, consent_given:true
      };
      if (APP.identityHashColumnMissing) delete guestValues.identity_hash;
      let guest;
      if (APP.returningGuest) {
        const { data, error } = await supabase.from('guests').update(guestValues).eq('id', APP.returningGuest.id).eq('is_checked_in', false).select().single();
        if (error) throw error;
        guest = data;
      } else {
        const { data, error } = await supabase.from('guests').insert([guestValues]).select().single();
        if (error) throw error;
        guest = data;
      }
      APP.guestDbId = guest.id;
      const tokens = APP.capturedTokens.filter(t => t.embedding?.length === 128);
      if (tokens.length>0) {
        if (APP.returningGuest) {
          const { error:oldTokensError } = await supabase.from('face_tokens').delete().eq('guest_id', guest.id);
          if (oldTokensError) throw oldTokensError;
        }
        const rows = tokens.map(t=>({ guest_id:guest.id, face_token:JSON.stringify(t.embedding), angle_name:t.angle }));
        const { error:tokErr } = await supabase.from('face_tokens').insert(rows);
        if (tokErr) throw tokErr;
      }
      persistStayLocal(room);
      showToast('Room allocated!', 'success');
      navigateTo('checkinOptions');
    } catch(e) {
      console.error(e);
      if (isNetworkError(e)) {
        APP.supabaseDown = true;
        setDbBanner(true);
        const randNum = (APP.allocatedRoom && APP.allocatedRoom.room_number) || String(Math.floor(100 + Math.random() * 900));
        persistStayLocal({
          room_number: randNum,
          room_type: (APP.allocatedRoom && APP.allocatedRoom.room_type) || APP.regRoomType,
          passkeyHash: APP.passkeyHash
        });
        showToast('Saved on this device. Database is offline.', 'success');
        navigateTo('checkinOptions');
      } else {
        toastError('', e);
      }
    } finally {
      APP.saveInFlight = false;
    }
  }

  // ── Check‑in Options ─────────────────────────
  function renderCheckinOptions() {
    if(!APP.allocatedRoom) { navigateTo('register'); return; }
    const room = APP.allocatedRoom;
    mainContent.innerHTML = `
      <div class="room-hero">
        <div class="big-number">${escapeHTML(room.room_number)}</div>
        <p class="room-kicker">${escapeHTML(room.room_type)}</p>
        <p class="passkey-line"><span>Passkey</span>${escapeHTML(APP.regPasskey)}</p>
      </div>
      <div class="choice-row">
        <button class="btn btn-primary" id="btnFace">Face scan</button>
        <button class="btn btn-outline" id="btnPasskey">Room + passkey</button>
      </div>
    `;
    document.getElementById('btnPasskey').onclick = ()=> navigateTo('passkeyCheckin');
    document.getElementById('btnFace').onclick = ()=> navigateTo('faceCheckin');
  }

  // ── Passkey Check‑in (fix room type) ─────────
  function renderPasskeyCheckin() {
    mainContent.innerHTML = `
      <h2 class="display-title">Passkey check-in</h2>
      <label>Room number</label>
      <input type="text" id="pkRoom" placeholder="Room number" value="${escapeHTML(APP.allocatedRoom?.room_number||'')}">
      <label>Passkey</label>
      <input type="password" id="pkPasskey" placeholder="Passkey" maxlength="8">
      <button class="btn btn-primary" id="btnVerify">Verify and check in</button>
    `;
    document.getElementById('btnVerify').onclick = async ()=>{
      if (APP.saveInFlight) return;
      const roomNum = document.getElementById('pkRoom').value.trim();
      const passkey = document.getElementById('pkPasskey').value.trim();
      if(!roomNum||!passkey) return showToast('Enter room and passkey','error');
      const inputPasskeyHash = await hashPasskey(passkey);
      APP.saveInFlight = true;
      const verifyBtn = document.getElementById('btnVerify');
      verifyBtn.disabled = true;
      try {
        if (APP.supabaseDown) {
          const stay = getLocalStay();
          if (!stay || stay.room_number !== roomNum || !(await storedPasskeyMatches(stay.passkeyHash || stay.passkey, inputPasskeyHash)) || stay.is_checked_in) return showToast('Invalid room or passkey','error');
          stay.passkeyHash = inputPasskeyHash; delete stay.passkey;
          stay.is_checked_in = true;
          saveLocalStay(stay);
          APP.checkedIn = true; APP.guestDbId = stay.guestDbId; APP.allocatedRoom = { room_number: stay.room_number, room_type: stay.room_type, passkeyHash: stay.passkeyHash }; APP.regName = stay.name || '';
          logDeskEvent('checked_in', { guestDbId: APP.guestDbId, name: APP.regName, room_number: APP.allocatedRoom?.room_number });
          showToast('Checked in! Welcome!','success'); navigateTo('room'); return;
        }
        const { data: candidates, error } = await supabase.from('guests').select('*').eq('room_number',roomNum).eq('is_checked_in',false).limit(20);
        if (error) throw error;
        let data = null;
        for (const candidate of candidates || []) if (await storedPasskeyMatches(candidate.passkey, inputPasskeyHash)) { data = candidate; break; }
        if(!data) return showToast('Invalid room or passkey','error');
        const { error:updErr } = await supabase.from('guests').update({is_checked_in:true,passkey:inputPasskeyHash}).eq('id',data.id);
        if(updErr) throw updErr;
        // get room type from rooms table
        const { data:roomData, error:roomErr } = await supabase.from('rooms').select('room_type,passkey').eq('room_number',roomNum).single();
        if (roomErr) throw roomErr;
        if (roomData?.passkey) {
          const { error:roomPasskeyError } = await supabase.from('rooms').update({ passkey: inputPasskeyHash }).eq('room_number', roomNum);
          if (roomPasskeyError) throw roomPasskeyError;
        }
        APP.checkedIn = true;
        APP.guestDbId = data.id;
        APP.allocatedRoom = { room_number:data.room_number, room_type: roomData?.room_type || 'N/A', passkeyHash:inputPasskeyHash };
        APP.regName = data.name;
        logDeskEvent('checked_in', { guestDbId: APP.guestDbId, name: APP.regName, room_number: APP.allocatedRoom?.room_number });
        const stay = getLocalStay(); if (stay && stay.room_number === roomNum) { stay.passkeyHash = inputPasskeyHash; delete stay.passkey; stay.is_checked_in = true; saveLocalStay(stay); }
        showToast('Checked in! Welcome!','success');
        navigateTo('room');
      } catch(e) {
        if (isNetworkError(e)) {
          APP.supabaseDown = true; setDbBanner(true);
          const stay = getLocalStay();
          if (stay && stay.room_number === roomNum && await storedPasskeyMatches(stay.passkeyHash || stay.passkey, inputPasskeyHash) && !stay.is_checked_in) {
            stay.passkeyHash = inputPasskeyHash; delete stay.passkey; stay.is_checked_in = true; saveLocalStay(stay);
            APP.checkedIn = true; APP.guestDbId = stay.guestDbId; APP.allocatedRoom = { room_number: stay.room_number, room_type: stay.room_type, passkeyHash: stay.passkeyHash }; APP.regName = stay.name || '';
          logDeskEvent('checked_in', { guestDbId: APP.guestDbId, name: APP.regName, room_number: APP.allocatedRoom?.room_number });
            showToast('Checked in! Welcome!','success'); navigateTo('room');
          } else showToast('Database offline. No matching saved stay on this device.','error');
        } else showToast('Error: '+e.message,'error');
      }
      finally { APP.saveInFlight = false; if (verifyBtn.isConnected) verifyBtn.disabled = false; }
    };
  }

  // ── Face Scan Check‑in (2000ms loop, fix room type) ──
  function renderFaceCheckin() {
    APP.blinkClosed = false; APP.blinkComplete = false; APP.faceCheckInInFlight = false;
    logDeskEvent('at_door', APP.guestDbId ? { guestDbId: APP.guestDbId, name: APP.regName, room_number: APP.allocatedRoom?.room_number } : null);
    mainContent.innerHTML = `
      <h2 class="display-title">Face scan</h2>
      <div class="camera-container"><video id="fcCamVideo" autoplay playsinline muted></video><div class="viewfinder-brackets"></div></div>
      <div class="camera-status" id="fcStatus">Initializing…</div>
      <button class="btn btn-text" id="btnCancelScan">Back</button>
    `;
    document.getElementById('btnCancelScan').onclick = ()=>{ stopCamera(); navigateTo('checkinOptions'); };
    startFaceCheckinCamera();
  }

  async function startFaceCheckinCamera() {
    stopCamera();
    try {
      const stream = await getCameraStream();
      const vid = document.getElementById('fcCamVideo');
      if(!vid) return;
      if (APP.screen !== 'faceCheckin' || !vid.isConnected) { stopCameraTracks(); return; }
      vid.srcObject = stream; await vid.play();
      await ensureLandmarker();
      if (APP.screen !== 'faceCheckin' || !vid.isConnected) { stopCamera(); return; }
      const status = document.getElementById('fcStatus');
      status.textContent = 'Look straight at the camera…';
      status.classList.remove('error');
      APP.isDetecting = true;
      APP.lastPoseTs = 0;
      APP.detectionInterval = setInterval(()=>faceCheckinLoop(vid), 100);
    } catch(e) {
      const status = document.getElementById('fcStatus');
      if (status) { status.textContent = 'Camera error: '+e.message; status.classList.add('error'); }
    }
  }

  async function faceCheckinLoop(video) {
    if(!APP.isDetecting || APP.screen!=='faceCheckin') { stopCamera(); return; }
    if (APP.faceCheckInInFlight) return;
    const status = document.getElementById('fcStatus');
    try {
      const now = performance.now();
      if (now - APP.lastPoseTs < 95) return;
      APP.lastPoseTs = now;
      const result = APP.faceLandmarker.detectForVideo(video, now);
      const face = result?.faceLandmarks?.[0];
      if (!face) { status.textContent = 'No face detected'; return; }
      const pose = poseFromLandmarks(face);
      if (pose.eyeDist < 0.06) { status.textContent = `Move closer · yaw ${pose.yaw.toFixed(2)} · pitch ${pose.pitch.toFixed(2)}`; return; }
      if (!angleAccepted('front', pose.yaw, pose.pitch)) { status.textContent = `Look straight at the camera · yaw ${pose.yaw.toFixed(2)} · pitch ${pose.pitch.toFixed(2)}`; return; }
      const categories = result.faceBlendshapes?.[0]?.categories || [];
      const blinkLeft = Number(categories.find(item => item.categoryName === 'eyeBlinkLeft')?.score || 0);
      const blinkRight = Number(categories.find(item => item.categoryName === 'eyeBlinkRight')?.score || 0);
      if (blinkLeft > 0.45 && blinkRight > 0.45) APP.blinkClosed = true;
      if (APP.blinkClosed && blinkLeft < 0.2 && blinkRight < 0.2) APP.blinkComplete = true;
      if (!APP.blinkComplete) { status.textContent = `Blink once to check in · yaw ${pose.yaw.toFixed(2)} · pitch ${pose.pitch.toFixed(2)}`; return; }
      APP.faceCheckInInFlight = true;

      const stay = getLocalStay();
      status.textContent = 'Blink confirmed. Checking saved face…';
      const liveEmbedding = await extractFaceEmbedding(video);
      const expectedGuestId = APP.guestDbId || stay?.guestDbId;
      let matchedGuestId = false;
      const savedEmbeddings = (stay?.guestDbId === expectedGuestId ? stay?.templates || [] : [])
        .map(record => parseEmbedding(record.embedding)).filter(Boolean);
      if (expectedGuestId && (String(expectedGuestId).startsWith('local-') || APP.supabaseDown)) {
        const bestDistance = savedEmbeddings.reduce((best, embedding) => Math.min(best, embeddingDistance(liveEmbedding, embedding)), Infinity);
        if (bestDistance <= MATCH_THRESHOLD) matchedGuestId = expectedGuestId;
      } else if (expectedGuestId) {
        matchedGuestId = await matchStoredEmbedding(liveEmbedding, expectedGuestId);
        if (!matchedGuestId) {
          const bestDistance = savedEmbeddings.reduce((best, embedding) => Math.min(best, embeddingDistance(liveEmbedding, embedding)), Infinity);
          if (bestDistance <= MATCH_THRESHOLD) matchedGuestId = expectedGuestId;
        }
      }
      if (!matchedGuestId) { status.textContent = 'Face did not match. Use passkey check-in.'; return; }
      APP.faceCheckInInFlight = true;
      const guestId = APP.guestDbId || stay?.guestDbId;
      if (!APP.supabaseDown && guestId && !String(guestId).startsWith('local-')) {
        const { data, error } = await supabase.from('guests').update({is_checked_in:true}).eq('id',guestId).eq('is_checked_in',false).select('id').maybeSingle();
        if (error) throw error;
        if (!data) { status.textContent = 'This guest is already checked in.'; return; }
      }
      const room = APP.allocatedRoom || {};
      const localStay = { ...(stay || {}), guestDbId: guestId, identityHash: APP.identityHash, name: APP.regName, room_number: room.room_number, room_type: room.room_type, passkeyHash: stay?.passkeyHash || APP.passkeyHash || '', templates: stay?.templates || [], is_checked_in:true };
      saveLocalStay(localStay);
      APP.checkedIn = true;
      APP.guestDbId = guestId;
      APP.regName = localStay.name || APP.regName;
      logDeskEvent('checked_in', { guestDbId: guestId, name: APP.regName, room_number: room.room_number });
      stopCamera(); showToast('Face recognized! Welcome!','success'); navigateTo('room');
    } catch(e) {
      if (isNetworkError(e)) {
        APP.supabaseDown = true; setDbBanner(true);
        const stay = getLocalStay();
        const saved = stay?.guestDbId === APP.guestDbId && stay?.templates?.some(t => parseEmbedding(t.embedding));
        if (saved && APP.blinkComplete) {
          stay.is_checked_in = true; saveLocalStay(stay);
          APP.checkedIn = true; APP.guestDbId = stay.guestDbId; APP.allocatedRoom = { room_number:stay.room_number, room_type:stay.room_type, passkey:stay.passkey }; APP.regName = stay.name || '';
          logDeskEvent('checked_in', { guestDbId: APP.guestDbId, name: APP.regName, room_number: APP.allocatedRoom?.room_number });
          stopCamera(); showToast('Face recognized! Welcome!','success'); navigateTo('room');
        } else { status.textContent = 'Database offline. Use passkey check-in.'; status.classList.add('error'); }
      } else { status.textContent = 'Error: '+e.message; status.classList.add('error'); }
    } finally { APP.faceCheckInInFlight = false; }
  }

  // ── Room Dashboard ───────────────────────────
  function renderRoom() {
    if(!APP.checkedIn) { mainContent.innerHTML = `<div class="lock-overlay">${ICO.lock}<p>Check in first</p></div>`; return; }
    const room = APP.allocatedRoom || {};
    const tiles = APP.roomTiles;
    const tileDefs = [
      { key:'lights', icon:ICO.lights, label:'Lights', on:'On', off:'Off', cls:tiles.lights?'on':'' },
      { key:'curtains', icon:ICO.curtains, label:'Curtains', on:'Open', off:'Closed', cls:tiles.curtains?'on':'' },
      { key:'tv', icon:ICO.tv, label:'TV', on:'On', off:'Off', cls:tiles.tv?'on':'' },
      { key:'dnd', icon:ICO.dnd, label:'Do not disturb', on:'Active', off:'Off', cls:tiles.dnd?'dnd-active':'' }
    ];
    const tilesHTML = tileDefs.map(t=>`
      <div class="tile ${t.cls}" data-tile-key="${t.key}">
        <div class="tile-icon">${t.icon}</div><div class="tile-label">${t.label}</div>
        <div class="tile-state">${APP.roomTiles[t.key]?t.on:t.off}</div>
      </div>`).join('');
    const serviceHTML = ['Towels','Water','Housekeeping'].map(label=>`
      <button type="button" class="tile service-request" data-service-label="${label}">
        <span class="tile-icon">${ICO.roomService}</span><span class="tile-label">${label}</span><span class="tile-state">Request</span>
      </button>`).join('');
    const suggestion = APP.suggestedPreferences;
    const suggestionActions = Array.isArray(suggestion?.action_order) ? suggestion.action_order.slice(-20) : [];
    const suggestionHTML = suggestion ? `<div class="card" id="lastStaySuggestion">
      <h3 class="section-title">Last stay</h3>
      <p class="hint" style="margin-top:0;text-align:left">AC ${Number(suggestion.ac_temp) || 24}°${suggestionActions.length ? ', then ' + suggestionActions.map(escapeHTML).join(', ') : ''}.</p>
      <button class="btn btn-outline" type="button" id="btnApplySuggestions">Apply suggestions</button>
    </div>` : '';
    mainContent.innerHTML = `
      <div class="room-hero">
        <h2 class="display-title">Welcome, ${escapeHTML(APP.regName)}</h2>
        <div class="room-number">${escapeHTML(room.room_number||'N/A')}</div>
        <p class="room-kicker">${escapeHTML(room.room_type||'')}</p>
      </div>
      ${suggestionHTML}
      <div class="card" id="acTemperatureControl">
        <label for="acTemp">AC temperature: <span id="acTempValue">${APP.acTemp}°</span></label>
        <input type="range" id="acTemp" min="16" max="30" step="1" value="${APP.acTemp}">
      </div>
      <div class="tile-grid">${tilesHTML}</div>
      <h3 class="section-title" style="margin-top:18px">Room service</h3>
      <div class="tile-grid">${serviceHTML}</div>
      <div class="checkout-block"><button class="btn btn-danger" id="btnCheckout">Check out</button></div>
    `;
    mainContent.querySelectorAll('.tile[data-tile-key]').forEach(t=>{
      t.onclick = ()=>{
        const key = t.dataset.tileKey;
        APP.roomTiles[key] = !APP.roomTiles[key];
        const labels = { lights:'Lights', curtains:'Curtains', tv:'TV', dnd:'Do not disturb' };
        if (labels[key]) recordGuestAction(labels[key] + ' ' + (APP.roomTiles[key] ? 'On' : 'Off'));
        renderScreen();
      };
    });
    mainContent.querySelectorAll('[data-service-label]').forEach(button=>{
      button.onclick = ()=>{
        const label = button.dataset.serviceLabel;
        const now = Date.now();
        if (now - (APP.serviceTapAt[label] || 0) < 2000) return;
        APP.serviceTapAt[label] = now;
        logDeskEvent('service_call', { guestDbId: APP.guestDbId, name: APP.regName, room_number: room.room_number }, label);
        recordGuestAction(label);
        showToast(label + ' requested','success');
      };
    });
    const temperature = document.getElementById('acTemp');
    temperature.oninput = ()=> { document.getElementById('acTempValue').textContent = temperature.value + '°'; };
    temperature.onchange = ()=> {
      APP.acTemp = Number(temperature.value);
      recordGuestAction('AC ' + APP.acTemp + '°');
      renderScreen();
    };
    const applyButton = document.getElementById('btnApplySuggestions');
    if (applyButton) applyButton.onclick = ()=>{
      const prefs = APP.suggestedPreferences;
      if (!prefs) return;
      const previousTemp = APP.acTemp;
      const previousControls = { lights:APP.roomTiles.lights, curtains:APP.roomTiles.curtains, tv:APP.roomTiles.tv, dnd:APP.roomTiles.dnd };
      APP.acTemp = Math.max(16, Math.min(30, Number(prefs.ac_temp) || 24));
      if (prefs.controls && typeof prefs.controls === 'object') {
        for (const key of ['lights','curtains','tv','dnd']) if (typeof prefs.controls[key] === 'boolean') APP.roomTiles[key] = prefs.controls[key];
      }
      APP.actionOrder = Array.isArray(prefs.action_order) ? prefs.action_order.slice(-20) : [];
      const appliedActions = [];
      if (APP.acTemp !== previousTemp) appliedActions.push('AC ' + APP.acTemp + '°');
      const labels = { lights:'Lights', curtains:'Curtains', tv:'TV', dnd:'Do not disturb' };
      for (const key of Object.keys(labels)) if (APP.roomTiles[key] !== previousControls[key]) appliedActions.push(labels[key] + ' ' + (APP.roomTiles[key] ? 'On' : 'Off'));
      APP.actionOrder = APP.actionOrder.concat(appliedActions).slice(-20);
      APP.suggestedPreferences = null;
      saveGuestPreferences().catch(e => console.warn('Preference save warning:', e));
      renderScreen();
    };
    document.getElementById('btnCheckout').onclick = handleCheckout;
  }

  async function handleCheckout() {
    if (APP.saveInFlight) return;
    if(!confirm('Check out and delete your face data? Your guest profile will remain for returning visits.')) return;
    APP.saveInFlight = true;
    const checkoutBtn = document.getElementById('btnCheckout');
    if (checkoutBtn) checkoutBtn.disabled = true;
    stopCamera();
    const guestId = APP.guestDbId;
    const guest = { guestDbId: guestId, name: APP.regName, room_number: APP.allocatedRoom?.room_number };
    try {
      if (!APP.supabaseDown && guestId && !String(guestId).startsWith('local-')) {
        await saveGuestPreferences();
        const { error:guestError } = await supabase.from('guests').update({is_checked_in:false}).eq('id',guestId);
        if (guestError) throw guestError;
        if(APP.allocatedRoom?.room_number) {
          const { error:roomError } = await supabase.from('rooms').update({is_occupied:false}).eq('room_number',APP.allocatedRoom.room_number);
          if (roomError) throw roomError;
        }
        await deleteFaceData({ removeProfile:false, clearLocal:false });
      }
      const stay = getLocalStay();
      if (stay && (!guestId || stay.guestDbId === guestId)) { stay.is_checked_in = false; stay.templates = []; saveLocalStay(stay); }
      logDeskEvent('checkout', guest);
      const deletedAt = new Date().toLocaleString();
      showToast(APP.supabaseDown
        ? `Local face data deleted at ${deletedAt}. Database face embeddings could not be reached.`
        : `Face data deleted at ${deletedAt}. Face embeddings and local biometric templates were deleted.`, 'success');
      resetApp(); navigateTo('consent');
    } catch(e) {
      if (isNetworkError(e)) {
        APP.supabaseDown = true; setDbBanner(true);
        const stay = getLocalStay();
        if (stay && (!guestId || stay.guestDbId === guestId)) { stay.is_checked_in = false; stay.templates = []; saveLocalStay(stay); }
        logDeskEvent('checkout', guest);
        const deletedAt = new Date().toLocaleString();
        showToast(`Local face data deleted at ${deletedAt}. Database face embeddings could not be reached.`, 'success');
        resetApp(); navigateTo('consent');
      } else showToast('Checkout error: '+e.message,'error');
    } finally { APP.saveInFlight = false; if (checkoutBtn?.isConnected) checkoutBtn.disabled = false; }
  }

  async function deleteFaceData({ removeProfile = true, clearLocal = true } = {}) {
    if(!APP.guestDbId) return;
    await preferenceSaveQueue.catch(() => {});
    const { error:deleteErr } = await supabase.from('face_tokens').delete().eq('guest_id',APP.guestDbId);
    if (deleteErr) throw deleteErr;
    if (removeProfile) {
      const { error:prefsError } = await supabase.from('guest_preferences').delete().eq('guest_id',APP.guestDbId);
      if (prefsError) throw prefsError;
      const { error:guestError } = await supabase.from('guests').delete().eq('id',APP.guestDbId);
      if (guestError) throw guestError;
    }
    if (clearLocal) clearLocalStay();
  }

  function resetApp() {
    APP.checkedIn=false; APP.guestDbId=null; APP.allocatedRoom=null; APP.capturedTokens=[];
    APP.regPasskey=''; APP.passkeyHash=''; APP.isCapturingAngle=false;
    APP.currentGuestIndex=0; APP.currentAngleName='front'; APP.stableCount=0;
    APP.identityHash=''; APP.returningGuest=null; APP.returningHasFace=false; APP.useSavedFacePrompt=false;
    APP.acTemp=24; APP.actionOrder=[]; APP.suggestedPreferences=null; APP.preferencesGuestId=null;
    APP.identityHashColumnMissing=false; APP.preferencesSchemaMissing=false;
    APP.blinkClosed=false; APP.blinkComplete=false; APP.faceCheckInInFlight=false;
    APP.serviceTapAt={};
    APP.roomTiles = { lights:true, ac:false, curtains:false, tv:false, dnd:false, roomService:false };
  }

  // ── Privacy Dashboard ────────────────────────
  function renderPrivacy() {
    if(!APP.checkedIn) { mainContent.innerHTML = `<div class="lock-overlay">${ICO.lock}<p>Check in first</p></div>`; return; }
    mainContent.innerHTML = `
      <div class="card">
        <h3 class="section-title">What is stored</h3>
        <p>Face embeddings and a local pose template — not photos. ID number on file: ${escapeHTML(maskIdNumber(APP.regIdNumber))}.</p>
        <p class="meta" style="margin-top:12px;">Guest id ${APP.guestDbId||'N/A'}</p>
        <button class="btn btn-danger" id="btnDeleteFaceData" style="margin-top:16px;">Delete my data</button>
        <p class="hint">Removes your face embeddings, guest profile, preferences, and local biometric cache.</p>
      </div>
      <button class="btn btn-text" id="btnBackToRoom">Back to room</button>
    `;
    document.getElementById('btnDeleteFaceData').onclick = async ()=>{
      if(!confirm('Delete your guest profile and all saved data?')) return;
      try {
        if (APP.guestDbId && !String(APP.guestDbId).startsWith('local-')) {
          if (APP.supabaseDown) throw new Error('Database is offline. Guest data could not be deleted.');
          if(APP.allocatedRoom?.room_number) {
            const { error:roomError } = await supabase.from('rooms').update({is_occupied:false}).eq('room_number',APP.allocatedRoom.room_number);
            if (roomError) throw roomError;
          }
          await deleteFaceData();
        } else clearLocalStay();
        APP.capturedTokens = [];
        const deletedAt = new Date().toLocaleString();
        showToast(`Face data deleted at ${deletedAt}. Face embeddings, guest profile, preferences, and local biometric cache were deleted.`, 'success');
        resetApp();
        navigateTo('consent');
      } catch(e) {
        if (isNetworkError(e)) { APP.supabaseDown = true; setDbBanner(true); showToast('Database is offline. Face data could not be updated.','error'); }
        else showToast('Error: '+e.message,'error');
      }
    };
    document.getElementById('btnBackToRoom').onclick = ()=> navigateTo('room');
  }

  // ── Init ─────────────────────────────────────
  async function init() {
    await probeSupabase();
    navigateTo('consent');
  }
  window.addEventListener('beforeunload', stopCamera);
  init().catch(e=>{ console.error(e); showToast('Init error','error'); });
})();
</script>
</body>
