<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Face-Key Desk</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
  <style>
    :root { color-scheme: dark; --bg:#10100f; --panel:#191917; --panel2:#20201d; --text:#f3eee4; --muted:#9b978e; --accent:#e0c78a; --line:#34332e; --green:#9fc9a8; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font:15px/1.45 Outfit,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .shell { max-width:1600px; margin:auto; padding:32px clamp(18px,3vw,48px) 48px; }
    header { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:26px; }
    .eyebrow { color:var(--accent); font-size:11px; font-weight:700; letter-spacing:.19em; text-transform:uppercase; }
    h1 { margin:5px 0 0; font-size:clamp(30px,4vw,46px); letter-spacing:-.045em; font-weight:600; }
    .live { display:flex; align-items:center; gap:9px; color:var(--muted); font-size:13px; }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--green); box-shadow:0 0 12px #9fc9a866; }
    .banner { display:none; padding:14px 17px; margin:0 0 22px; border:1px solid #8a6248; border-radius:12px; background:#35251c; color:#f3dcc5; }
    .banner.visible { display:block; }
    .layout { display:grid; grid-template-columns:minmax(0,1fr) 260px; gap:24px; align-items:start; }
    .columns { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; }
    .column { min-height:340px; padding:16px; border:1px solid var(--line); border-radius:16px; background:#141413; }
    .column-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:15px; }
    h2 { margin:0; font-size:15px; font-weight:600; }
    .count { display:grid; place-items:center; min-width:25px; height:25px; padding:0 7px; border-radius:99px; background:#2b2923; color:var(--accent); font-size:12px; }
    .cards { display:grid; gap:11px; }
    .card { padding:15px; border:1px solid #393831; border-radius:12px; background:var(--panel); }
    .card.highlight { animation:highlight 2.7s ease-out both; }
    @keyframes highlight { 0%,35% { border-color:var(--accent); background:#302a1d; box-shadow:0 0 0 1px #e0c78a55,0 0 26px #e0c78a22; } 100% { border-color:#393831; background:var(--panel); box-shadow:none; } }
    .guest { font-size:17px; font-weight:600; overflow-wrap:anywhere; }
    .room { margin-top:3px; color:var(--accent); font-size:14px; }
    .detail { margin-top:8px; color:var(--accent); font-size:13px; font-weight:600; }
    .time { margin-top:10px; color:var(--muted); font-size:12px; }
    .guest-id { margin-top:5px; color:#77746d; font:10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; overflow-wrap:anywhere; }
    .actions { display:flex; justify-content:flex-end; margin-top:12px; }
    button { border:1px solid #796a48; border-radius:8px; padding:7px 11px; color:var(--accent); background:#28251e; font:inherit; font-size:12px; font-weight:600; cursor:pointer; }
    button:hover { background:#393324; }
    button:disabled { opacity:.55; cursor:wait; }
    .empty { padding:26px 8px; color:#77746d; text-align:center; font-size:13px; }
    aside { position:sticky; top:20px; padding:16px; border:1px solid var(--line); border-radius:16px; background:#141413; }
    aside h2 { margin-bottom:14px; }
    .history { display:grid; gap:10px; }
    .history-item { padding:11px 0; border-top:1px solid #292824; opacity:.56; }
    .history-type { color:var(--accent); font-size:11px; text-transform:uppercase; letter-spacing:.08em; }
    .history-name { margin-top:3px; font-size:13px; font-weight:600; }
    .history-meta { color:var(--muted); font-size:11px; }
    .history-empty { color:#77746d; font-size:13px; }
    @media (max-width:1050px) { .layout { grid-template-columns:1fr; } aside { position:static; } }
    @media (max-width:740px) { .shell { padding:22px 14px; } header { align-items:flex-start; flex-direction:column; } .columns { grid-template-columns:1fr; } .column { min-height:0; } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div><div class="eyebrow">Front of house</div><h1>Face-Key Desk</h1></div>
      <div class="live"><span class="dot" id="connectionDot"></span><span id="connectionLabel">Connecting to desk events</span></div>
    </header>
    <div class="banner" id="offlineBanner">Database offline. Restore the Supabase project. The desk cannot see the guest until that host is live.</div>
    <div class="layout">
      <section class="columns" aria-label="Live guest activity">
        <section class="column"><div class="column-head"><h2>At the door</h2><span class="count" id="doorCount">0</span></div><div class="cards" id="doorCards"><div class="empty">Loading…</div></div></section>
        <section class="column"><div class="column-head"><h2>Going to the room</h2><span class="count" id="arrivalCount">0</span></div><div class="cards" id="arrivalCards"><div class="empty">Loading…</div></div></section>
        <section class="column"><div class="column-head"><h2>Service calls</h2><span class="count" id="serviceCount">0</span></div><div class="cards" id="serviceCards"><div class="empty">Loading…</div></div></section>
      </section>
      <aside><h2>Recently completed</h2><div class="history" id="history"><div class="history-empty">Loading…</div></div></aside>
    </div>
  </main>
<script>
(() => {
  const SUPABASE_URL = 'https://qwrrpzzsjpnemxfasxcn.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_OF-LjPkDTMCMKrctyPj_1A_2j16blG0';
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const highlightIds = new Set();
  let firstLoad = true;
  let refreshing = false;

  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const formatTime = value => new Intl.DateTimeFormat(undefined, {hour:'numeric',minute:'2-digit',month:'short',day:'numeric'}).format(new Date(value));
  function setOffline(offline) {
    document.getElementById('offlineBanner').classList.toggle('visible', offline);
    document.getElementById('connectionDot').style.background = offline ? '#d28f70' : 'var(--green)';
    document.getElementById('connectionLabel').textContent = offline ? 'Database offline' : 'Live desk activity';
  }
  function card(row, action, highlighted) {
    const name = row.guest_name || 'Guest at the door';
    return `<article class="card${highlighted ? ' highlight' : ''}">
      <div class="guest">${esc(name)}</div>
      <div class="room">Room ${esc(row.room_number || '—')}</div>
      ${row.type === 'service_call' && row.detail ? `<div class="detail">${esc(row.detail)}</div>` : ''}
      <div class="time">${esc(formatTime(row.created_at))}</div>
      <div class="guest-id">Guest ID: ${esc(row.guest_id || 'Not linked')}</div>
      ${row.type === 'at_door' && row.guest_id ? `<div class="actions"><button data-checkin="${esc(row.id)}" data-guest-id="${esc(row.guest_id)}" data-guest-name="${esc(row.guest_name || '')}" data-room-number="${esc(row.room_number || '')}">Mark checked in</button></div>` : ''}
      ${action ? `<div class="actions"><button data-done="${esc(row.id)}">${action}</button></div>` : ''}
    </article>`;
  }
  function renderColumn(id, rows, empty, action, allowHighlight=false) {
    document.getElementById(id).innerHTML = rows.length ? rows.map(row => {
      const highlight = allowHighlight && highlightIds.has(row.id);
      if (highlight) setTimeout(() => highlightIds.delete(row.id), 2800);
      return card(row, action, highlight);
    }).join('') : `<div class="empty">${empty}</div>`;
  }
  function render(rows) {
    const doors = rows.filter(r => r.type === 'at_door' && r.status === 'new');
    const arrivals = rows.filter(r => r.type === 'checked_in' && r.status === 'new');
    const calls = rows.filter(r => r.type === 'service_call' && r.status === 'new');
    const history = rows.filter(r => r.status === 'done' || r.type === 'checkout').slice(0, 12);
    document.getElementById('doorCount').textContent = doors.length;
    document.getElementById('arrivalCount').textContent = arrivals.length;
    document.getElementById('serviceCount').textContent = calls.length;
    renderColumn('doorCards', doors, 'No one at the door', null);
    renderColumn('arrivalCards', arrivals, 'No arrivals', 'Mark seen');
    renderColumn('serviceCards', calls, 'No calls', 'Done', true);
    document.getElementById('history').innerHTML = history.length ? history.map(row => `<div class="history-item">
      <div class="history-type">${row.type === 'checkout' ? 'Checkout' : row.type === 'service_call' ? 'Service call · done' : 'Checked in · seen'}</div>
      <div class="history-name">${esc(row.guest_name || 'Guest')}</div>
      ${row.type === 'service_call' && row.detail ? `<div class="detail">${esc(row.detail)}</div>` : ''}
      <div class="history-meta">Room ${esc(row.room_number || '—')} · ${esc(formatTime(row.created_at))}</div>
      <div class="guest-id">Guest ID: ${esc(row.guest_id || 'Not linked')}</div>
    </div>`).join('') : '<div class="history-empty">Nothing completed yet</div>';
    firstLoad = false;
  }
  async function refresh(highlightId) {
    if (refreshing) return;
    refreshing = true;
    try {
      let result = await db.from('desk_events').select('id,guest_id,guest_name,room_number,type,detail,status,created_at').order('created_at', {ascending:false}).limit(50);
      if (result.error && /detail/i.test(String(result.error.message || '')) && /does not exist|could not find|schema cache/i.test(String(result.error.message || ''))) {
        result = await db.from('desk_events').select('id,guest_id,guest_name,room_number,type,status,created_at').order('created_at', {ascending:false}).limit(50);
      }
      const {data, error} = result;
      if (error) throw error;
      if (highlightId) highlightIds.add(highlightId);
      if (!firstLoad) {
        for (const row of data || []) if (row.type === 'service_call' && row.status === 'new' && !renderedIds.has(row.id)) highlightIds.add(row.id);
      }
      renderedIds = new Set((data || []).map(row => row.id));
      render(data || []);
      setOffline(false);
    } catch (error) {
      if (error instanceof TypeError || /failed to fetch|network|resolve|fetch/i.test(String(error?.message || error))) setOffline(true);
      else document.getElementById('connectionLabel').textContent = 'Unable to load desk events';
    } finally { refreshing = false; }
  }
  let renderedIds = new Set();
  document.addEventListener('click', async event => {
    const checkinButton = event.target.closest('button[data-checkin]');
    if (checkinButton) {
      checkinButton.disabled = true;
      try {
        const {data: updatedGuest, error: guestError} = await db.from('guests').update({is_checked_in:true}).eq('id', checkinButton.dataset.guestId).eq('is_checked_in', false).select('id').maybeSingle();
        if (guestError) throw guestError;
        if (!updatedGuest) throw new Error('Guest is already checked in or is no longer available.');
        const {error: eventError} = await db.from('desk_events').insert({
          guest_id: checkinButton.dataset.guestId,
          guest_name: checkinButton.dataset.guestName || '',
          room_number: checkinButton.dataset.roomNumber || '',
          type: 'checked_in',
          status: 'new'
        });
        if (eventError) throw eventError;
        await db.from('desk_events').update({status:'done'}).eq('id', checkinButton.dataset.checkin);
        await refresh();
      } catch (error) {
        checkinButton.disabled = false;
        checkinButton.textContent = error.message || 'Check-in failed';
        if (error instanceof TypeError || /failed to fetch|network|resolve|fetch/i.test(String(error?.message || error))) setOffline(true);
      }
      return;
    }
    const button = event.target.closest('button[data-done]');
    if (!button) return;
    button.disabled = true;
    try {
      const {error} = await db.from('desk_events').update({status:'done'}).eq('id', button.dataset.done);
      if (error) throw error;
      await refresh();
    } catch (error) {
      if (error instanceof TypeError || /failed to fetch|network|resolve|fetch/i.test(String(error?.message || error))) setOffline(true);
      button.disabled = false;
    }
  });
  db.channel('desk-events-live').on('postgres_changes', {event:'INSERT',schema:'public',table:'desk_events'}, payload => refresh(payload.new?.type === 'service_call' ? payload.new.id : null)).on('postgres_changes', {event:'UPDATE',schema:'public',table:'desk_events'}, () => refresh()).subscribe();
  refresh();
  setInterval(() => refresh(), 4000);
})();
</script>
</body>
</html>
